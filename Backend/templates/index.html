<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hate Speech Prediction</title>
</head>
<body>
    <h1>Enter Text to Predict if it's Hate Speech</h1>
